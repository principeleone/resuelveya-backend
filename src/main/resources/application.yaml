spring:
  application:
    name: resuelve-api

  #profiles:
    #active: dev  # por defecto usas local

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate


security:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:3600000}

firebase:
  config:
    path: ${FIREBASE_CONFIG_PATH:}
  credentials:
    json: ${FIREBASE_CREDENTIALS_JSON:}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics, mappings
  endpoint:
    health:
      show-details:always
