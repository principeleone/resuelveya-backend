spring:
  application:
    name: resuelve-api

  #profiles:
    #active: dev  # por defecto usas local

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate


security:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:3600000}

server:
    port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details:always
